
  name: Pipeline Tarea 

  on:
    push:
      branches: [ "main", "develop", "feature/*", "docker" ]
    pull_request:
      branches: [ "main", "develop" ]

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout del código
          uses: actions/checkout@v4

        - name: Configurar Java 21
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
            cache: 'maven'

        - name: Ejecutar pruebas
          run: mvn test

    build:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - name: Checkout del código
          uses: actions/checkout@v4

        - name: Configurar Java 21
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
            cache: 'maven'

        - name: Construir JAR
          run: mvn clean package -DskipTests

        - name: Loguear en GitHub Container Registry (GHCR)
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Construir imagen Docker
          run: |
            docker build -t ghcr.io/${{ github.repository }}:latest .

    publish:
      needs: build
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout del código
          uses: actions/checkout@v4

        - name: Loguear en GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Extraer SHA corto (7 caracteres)
          id: vars
          run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

        - name: Construir y etiquetar imagen Docker para publish
          run: |
            IMAGE_NAME=ghcr.io/${{ github.repository }}
            TAG=${{ steps.vars.outputs.sha_short }}
            
            docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$TAG .
            docker push $IMAGE_NAME:latest
            docker push $IMAGE_NAME:$TAG
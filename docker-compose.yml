services:
  compras-api:
    image: tarea2-hernandez-perez:local

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${APP_PORT:-3001}:${APP_PORT:-3001}"

    environment:
      APP_PORT: "${APP_PORT:-3001}"
      APP_ENV: production
      CSV_PATH: /data/compras.csv

    volumes:
      - type: bind
        source: ./compras.csv
        target: /data/compras.csv
        read_only: true
        bind:
          create_host_path: false